- name: atas
  short: ATAS
  title: "Any Time, Any Space: A World-State-Centric Framework for Agentic Video Generation"
  subtitle: "以世界状态为中心的智能体视频生成"
  authors: ["Weijie Wang*", "Haomin Zhang*", "Ye Li*", "Akide Liu", "Zeyu Zhang", "Haoyu Zhao", "Yefei He", "Donny Y. Chen", "Feng Chen", "Bohan Zhuang†"]
  venue: "arXiv 2026 · ICLR 2027 在审"
  role: "共同第一作者"
  highlight:
    label: "Hugging Face Daily Papers 当日第 2"
    url: https://huggingface.co/papers/date/2026-10-15
  description: "为多镜头视频生成维护场景记忆与事件记忆：回到旧场景、换机位重放旧事件时，先取出相关状态作为条件，生成后经检查再写回。在四个视频生成器上提升了全部跨镜头一致性指标，人工评测六项第一。"
  thumbnail: /projects/atas-thumb.webp
  thumbnailAlt: "ATAS 生成短片中的一个镜头：客厅沙发上端着杯子的男人"
