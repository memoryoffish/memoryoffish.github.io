- name: atas
  title: "ATAS：以世界状态为中心的智能体视频生成"
  kind: "研究工作 · 共同第一作者"
  description: "通过持久的场景记忆与事件记忆支持多镜头视频生成，在返回旧场景或重现历史事件时检索相关状态，并经验证后更新记忆。"
