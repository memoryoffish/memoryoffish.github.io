- name: reca
  title: "ReCA：通过递归上下文分配实现多镜头长视频外推"
  kind: "预印本 · 2026"
  description: "在有限的短视频生成预算下，递归组织镜头规划、上下文分配与状态更新，将已有画面延续为多镜头长视频。"
  thumbnail: /projects/reca.svg
  thumbnailAlt: "多镜头视频时间线与上下文节点示意图"
  links:
