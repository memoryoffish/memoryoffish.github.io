- name: unirlm
  short: UniRLM
  title: "UniRLM: Recursive Unified State Modeling for Interleaved Generation"
  subtitle: "面向图文交错生成的递归统一状态建模"
  venue: "AAAI 2027 在审"
  role: "共同第一作者"
  description: "长篇图文交错生成越往后越崩，症结在图像生成只在一两张图的短上下文上训练过。UniRLM 免训练地把长上下文轨迹拆成子任务 DAG：每次调用只带入直接依赖的图像，校验通过才写回，独立节点并行执行。"

- name: reca
  short: ReCA
  title: "ReCA: Multi-Shot Long Video Extrapolation via Recursive Context Allocation"
  subtitle: "通过递归上下文分配实现多镜头长视频外推"
  authors: ["Akide Liu", "Jinbo Xing", "Chaojie Mao", "Ye Li", "Zeyu Zhang", "Yefei He", "Weijie Wang", "Zihan Wang", "Yu Liu", "Gholamreza Haffari", "Bohan Zhuang"]
  venue: "arXiv 2026 · 预印本"
  description: "把一帧画面续写成几分钟、有镜头结构的长视频。ReCA 认为瓶颈在上下文分配而非长度：递归拆成上下文有界的子问题，只在叶子节点调用短视频模型，多镜头一致性指标提升 28–43%。"
  thumbnail: /projects/reca-thumb.webp
  thumbnailAlt: "ReCA 展示视频中的一帧：航拍悉尼歌剧院与海港大桥"
  links:
    - label: arXiv
      url: https://arxiv.org/abs/2605.26525
    - label: 项目页
      url: https://reca.vmv.re/
    - label: 展示仓库
      url: https://github.com/memoryoffish/ReCA

- name: gen-rsi
  short: Gen-RSI
  title: "Gen-RSI: Recursive Self-Improvement of Video Generators through World Proxies"
  subtitle: "借助世界代理实现视频生成模型的递归自改进"
  venue: "ICLR 2027 在审"
  description: "把生成的视频重建为可执行的 Blender 代理，用物理仿真修正后渲染出来，再在学生模型自己的去噪状态上蒸馏回视频生成器，逐轮改进物理一致性。"
