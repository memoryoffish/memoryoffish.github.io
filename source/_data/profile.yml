intro: 浙江大学软件工程本科生，关注世界模型、视频生成与多模态交错生成。
paragraphs:
  - 我是李业，浙江大学软件工程专业 2023 级本科生，研究视频生成与世界模型。我关心的问题是：怎样让视频生成模型像一个持续存在的世界那样工作——镜头切走再切回来，场景和人物还在原处；物体下落、碰撞，过程合乎物理。
  - 作为共同第一作者，我完成了 <strong>ATAS</strong>——为多镜头视频生成维护可检索的场景记忆与事件记忆，获 Hugging Face Daily Papers 当日第 2 名；以及 <strong>UniRLM</strong>——把图文交错生成的长上下文拆成只带直接依赖的短调用。作为学生二作（代码实验主力）共同完成了 <strong>ReCA</strong>（把几分钟的长视频生成看作上下文分配问题）和 <strong>Gen-RSI</strong>（借助 Blender 物理仿真修正生成结果，再蒸馏回视频生成器）。
